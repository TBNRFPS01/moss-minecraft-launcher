[package]
name = "moss"
version = "0.1.0"
description = "MOSS Minecraft launcher"
authors = ["TBNRFPS01"]
edition = "2021"

[lib]
name = "moss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
